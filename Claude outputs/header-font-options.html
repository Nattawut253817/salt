<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>Header Font Options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@600;700&family=Mitr:wght@600;700&family=Prompt:wght@600;700&family=Sriracha&family=Krub:wght@600;700&family=Athiti:wght@600;700&family=Pridi:wght@600;700&family=Itim&family=Pattaya&family=Trirong:wght@600;700&family=Chonburi&family=IBM+Plex+Sans+Thai:wght@600;700&family=Fahkwang:wght@600;700&family=Noto+Serif+Thai:wght@600;700&family=Kodchasan:wght@600;700&family=Maitree:wght@600;700&family=K2D:wght@600;700&family=Mali:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 60px;
    background: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .page-title {
    max-width: 900px;
    margin: 0auto 28px;
    margin: 0 auto 28px;
    text-align: center;
  }
  .page-title h1 { font-size: 1.3rem; color: #1e293b; margin: 0 0 6px; }
  .page-title p { font-size: 0.85rem; color: #64748b; margin: 0; }

  .grid {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
    border: 1px solid #eef0f3;
  }
  .card-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: #fafbfc;
    border-bottom: 1px solid #eef0f3;
    font-size: 0.72rem;
    font-weight: 700;
    color: #94a3b8;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .card-label span.num { color: #cbd5e1; }

  .header-brand-row {
    background:
      radial-gradient(circle at 12% 0%, rgba(255,255,255,0.30), transparent 45%),
      linear-gradient(180deg, rgba(255,255,255,0.14), rgba(255,255,255,0) 32%),
      linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
    padding: 16px 5%;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .brand-container { display: flex; align-items: center; gap: 15px; }
  .brand-logo-wrapper {
    background: #ffffff;
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    border: 2px solid rgba(255,255,255,0.6);
    flex-shrink: 0;
    font-weight: 800;
    color: #1a7a4c;
    font-size: 0.62rem;
    line-height: 1.1;
    text-align: center;
  }
  .brand-text-group { display: flex; flex-direction: column; gap: 3px; text-align: left; }
  .brand-text-main {
    color: #fff;
    font-size: 1.15rem;
    font-weight: 700;
    line-height: 1.3;
    text-shadow: 0 2px 8px rgba(0,0,0,0.18);
  }
  .brand-text-sub {
    color: rgba(255,255,255,0.85);
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="page-title">
  <h1>เปรียบเทียบฟอนต์สำหรับข้อความส่วนหัว</h1>
  <p>ตัวอย่างข้อความจริงในกล่องสีชมพูของเว็บ — ยังไม่ได้แก้ไขไฟล์จริง เป็นแค่ตัวเลือกให้พิจารณาก่อน</p>
</div>

<div class="grid" id="grid"></div>

<script>
const fonts = [
  "Kanit", "Mitr", "Prompt",
  "Sriracha", "Krub", "Athiti",
  "Pridi", "Itim", "Pattaya",
  "Trirong", "Chonburi", "IBM Plex Sans Thai",
  "Fahkwang", "Noto Serif Thai", "Kodchasan",
  "Maitree", "K2D", "Mali"
];

const mainText = "ระบบเฝ้าระวังติดตามการบริโภคเกลือและโซเดียม เขตสุขภาพที่ 10";
const subText = "SMART SALT & SODIUM MONITOR";

const grid = document.getElementById('grid');
fonts.forEach((font, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-label"><span><span class="num">${String(i+1).padStart(2,'0')}.</span> ${font}</span></div>
    <div class="header-brand-row">
      <div class="brand-container">
        <div class="brand-logo-wrapper">DDC</div>
        <div class="brand-text-group">
          <span class="brand-text-main" style="font-family:'${font}', sans-serif;">${mainText}</span>
          <span class="brand-text-sub" style="font-family:'${font}', sans-serif;">${subText}</span>
        </div>
      </div>
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
